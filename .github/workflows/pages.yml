name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Veda de encuestas (LOREG 69.7): reconstruir sin encuestas el 23-nov a las 22:05 (hora
    # peninsular, UTC+1) y con ellas tras el cierre de los colegios, el 29-nov a las 20:10.
    - cron: '5 21 23 11 *'
    - cron: '10 19 29 11 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validar datos oficiales
        run: |
          sudo apt-get install -y poppler-utils >/dev/null
          python3 -I pipeline/boe_validate.py
          python3 -I pipeline/results_validate.py
          python3 -I pipeline/verify_quotes.py
      - name: Construir datos de la web
        run: python3 -I pipeline/build_web.py
      - name: Tests y build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
