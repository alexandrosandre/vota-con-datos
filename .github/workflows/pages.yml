name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validar datos oficiales
        run: |
          sudo apt-get install -y poppler-utils >/dev/null
          python3 -I pipeline/boe_validate.py
          python3 -I pipeline/results_validate.py
          python3 -I pipeline/verify_quotes.py
      - name: Construir datos de la web
        run: python3 -I pipeline/build_web.py
      - name: Tests del pipeline
        run: python3 -I -m unittest discover -s tests -v
      - name: Tests y build
        working-directory: web
        run: |
          npm ci
          npm test
          VCD_BASE=/ npm run build
      - name: Prueba de humo (Chrome sin interfaz)
        run: VCD_BASE=/ bash tests/smoke.sh
      # Despliegues sin cortes: copia en el nuevo despliegue el código y los datos (con nombre por contenido) de las
      # últimas versiones publicadas, para que quien tenga abierta o en caché una versión anterior no vea errores.
      - name: Conservar versiones anteriores
        run: python3 -I pipeline/conservar_versiones.py web/dist https://votacondatos.org
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
