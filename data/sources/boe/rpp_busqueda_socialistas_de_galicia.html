         function cargarTodo(){
            //tamPag es el número máximo de registros
            tamPag = 100000;
            document.getElementsByName("tamPag")[0].value = tamPag;
            alert('Por favor, a continuación, espere a que cargue el listado completo antes de generar la Excel.');
            //llamando a la búsqueda para obtener todos los registros
            document.forms[0].submit();
        }
        
        function generarExcel(){
            document.getElementById("botonexcel").value="Espere, generando Excel ...";
            document.getElementById("botonexcel").disabled=true;
            generar();
            document.getElementById("botonexcel").value="Generar Excel";
            document.getElementById("botonexcel").disabled=false;
        }
        
        function formatCadena(tabla) {
            var primerosTD = document.getElementsByClassName("firstTD");
            
            var i=0;
            while (i != primerosTD.length-1) {    
                var item = primerosTD[i];
                var temp = item.textContent;
                tabla = tabla.replace(item.innerHTML,temp)
                i++;
            }

            return tabla;
        }
        
                
        function generar(){
            cantidadRegistros();
            if (identificarNavegador()==0){
                alert(    'Por favor, compruebe que su navegador no tiene bloqueadas ' +
                        'las ventanas emergentes para este sitio, así el fichero ' +
                        'Excel generado se descargará completo a su ordenador.');
                generarExcelChrome('webpartido_politico.xls');
                alert('Ha finalizado la exportación a Excel. Encontrará el fichero en la carpeta de descargas de su navegador ');        
            } else {
                alert(    'Para que pueda exportar esta Excel en Internet Explorer, '+
                        'la opción de seguridad de "Inicializar y generar scripts de los ' + 
                        'controles ActiveX no marcados como seguros para ' + 
                        'scripts" deberá estar "Habilitada".');
                generarExcelExplorer('webpartido_politico.xls');
                alert('Ha finalizado la exportación a Excel. Compruebe el fichero descargado.');
            }    
        }
        
        function generarExcelChrome(nombreFichero){
            var tab_text = document.getElementsByTagName("table")[0].outerHTML;
            var textRange; var j = 0;
            var sa;
            tab_text = formatCadena(tab_text);

            sa = window.open('data:application/vnd.ms-excel,' + escape(tab_text)+';filename='+nombreFichero+';base64data');
            //sa = window.open('data:application/vnd.ms-excel,' + encodeURIComponent(tab_text)+';filename='+nombreFichero+';base64data');
            //Ojo que la función encodeURIComponent no codifica bien los caracteres UTF-8
            if (sa != null) {
                return (sa);
            } else {
                alert('El navegador ha bloqueado la ventana emergente');
            }
        }
        
        
        function generarExcelExplorer(nombreFichero){
            var numElementos = parseInt(document.getElementById('numElementos').value);
            numElementos++;
            var xls = new ActiveXObject('Excel.Application');
            //xls.visible=true;
            var newBook = xls.Workbooks.Add;
            newBook.Worksheets.Add;
            newBook.Worksheets(1).Activate;
            
            // se pone el titulo
            newBook.Worksheets(1).Cells(2, 2).value = 'WebPartido Politico';
                    
            var i = 1;
            var j = 1;
            var fil = 4;
            var col = 0;
            
            var table = document.getElementsByTagName('table')[0];
            var headers = document.getElementsByTagName("th");
         
            var f = 1;
            var th = ''; 
            
            while (f != 5) {    
                th=headers[f-1].innerHTML;
                newBook.Worksheets(1).Cells(fil, f).value = th;
                f++;
            }
            
            
            fil=fil+2;
            
            var rows = document.getElementsByTagName("tbody")[0].rows;
            
            f=0;
            var td1;
            var td2;
            var td3;
            var td4;
            while (f != numElementos-1) {    
                var row = rows[f];
                if (row != null){                 
                    var tds = row.getElementsByTagName("td");
                    //newBook.Worksheets(1).Cells(fil, 1).value = tds.innerHTML;
                    //Formateamos el primer campo 
                    var tdFirst = tds[0].innerHTML;
                    var temp = document.createElement('div');
                    temp.innerHTML = tdFirst;
                    td1 = temp.textContent || temp.innerText;
                    td1 = td1.replace('\t','');
                    td1 = td1.replace('\n','');
                    newBook.Worksheets(1).Cells(fil, 1).value = td1;
                    td2 = tds[1].innerHTML;
                    newBook.Worksheets(1).Cells(fil, 2).value = td2;
                    td3 = tds[2].innerHTML;
                    newBook.Worksheets(1).Cells(fil, 3).value = td3;
                    var td4 = tds[3].innerHTML;
                    newBook.Worksheets(1).Cells(fil, 4).value = td4;
                    fil++;
                    f++;
                }
            }
            
            newBook.Worksheets(1).Rows(2).EntireColumn.font.bold = true;

            newBook.Worksheets(1).Cells(2, 1).EntireColumn.AutoFit();
            if (newBook.Worksheets(1).Cells(2, 2).ColumnWidth > 80) {
                newBook.Worksheets(1).Cells(2, 2).ColumnWidth = 80;
            } 
            newBook.Worksheets(1).Cells(2, 2).EntireColumn.AutoFit();
            if (newBook.Worksheets(1).Cells(2, 2).ColumnWidth > 80) {
                newBook.Worksheets(1).Cells(2, 2).ColumnWidth = 80;
            } 
            newBook.Worksheets(1).Cells(2, 3).EntireColumn.AutoFit();
            if (newBook.Worksheets(1).Cells(2, 3).ColumnWidth > 100) {
                newBook.Worksheets(1).Cells(2, 3).ColumnWidth = 100;
            } 
            newBook.Worksheets(1).Cells(2, 4).EntireColumn.AutoFit();
            if (newBook.Worksheets(1).Cells(2, 4).ColumnWidth > 80) {
                newBook.Worksheets(1).Cells(2, 4).ColumnWidth = 80;
            }
            xls.visible=true; 
             
        }

        function identificarNavegador(){
            var ua = window.navigator.userAgent;
            var msie = ua.indexOf("MSIE ");
            if (msie > 0 || !!navigator.userAgent.match(/Trident.*rv\:11\./))      // If Internet Explorer
            {
                return 1;
            } else {
                return 0;
            }
        }
        
        function cantidadRegistros(){
            var table = document.getElementsByTagName("table")[0];
            var tbodyRowCount = table.tBodies[0].rows.length;
            document.getElementById("numElementos").value = tbodyRowCount; 
        }
